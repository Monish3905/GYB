replicaCount: 2

image:
  repository: gyb/api-gateway
  pullPolicy: IfNotPresent
  tag: "latest"

serviceAccount:
  create: true
  name: "gyb-service-account"

podAnnotations:
  # Istio sidecar injection
  sidecar.istio.io/inject: "true"
  # Prometheus scraping
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "8080"

# Example of Vault injection configuration (optional)
vault:
  enabled: false
  role: gyb-role
  secretPath: secret/data/gyb/config
